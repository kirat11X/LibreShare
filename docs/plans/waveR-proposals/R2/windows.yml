name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze workspace
        run: dart analyze --fatal-infos

      - name: Core unit tests
        run: |
          cd packages\libreshare_core
          dart test --exclude-tags slow

      - name: CLI unit tests
        run: |
          cd packages\libreshare_cli
          dart test

      - name: Build Windows release
        run: |
          cd apps\libreshare_app
          flutter build windows --release

      - name: Scripted TLS loopback transfer test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rxDir = New-Item -ItemType Directory -Path "$env:TEMP\libreshare-rx" -Force
          $txDir = New-Item -ItemType Directory -Path "$env:TEMP\libreshare-tx" -Force
          $testFile = "$txDir\test-payload.bin"
          
          # Generate 10 MiB pseudo-random test file
          $bytes = New-Object Byte[] (10 * 1024 * 1024)
          (New-Object System.Random).NextBytes($bytes)
          [System.IO.File]::WriteAllBytes($testFile, $bytes)
          $origHash = (Get-FileHash -Algorithm SHA256 $testFile).Hash
          
          # Compile CLI for testing
          dart compile exe packages\libreshare_cli\bin\ls.dart -o "$env:TEMP\ls.exe"
          
          # Start receiver in background
          $rxProc = Start-Process -FilePath "$env:TEMP\ls.exe" -ArgumentList "receive", "--port", "53330", "--dir", "$rxDir", "--auto-accept" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          
          try {
            # Execute send
            & "$env:TEMP\ls.exe" send "$testFile" --to "127.0.0.1:53330"
            if ($LASTEXITCODE -ne 0) { throw "Send command failed with exit code $LASTEXITCODE" }
            
            # Verify received file hash
            $receivedFile = "$rxDir\test-payload.bin"
            if (-not (Test-Path $receivedFile)) { throw "Received file does not exist" }
            $recvHash = (Get-FileHash -Algorithm SHA256 $receivedFile).Hash
            if ($origHash -ne $recvHash) { throw "Hash mismatch! Orig: $origHash, Recv: $recvHash" }
            Write-Host "TLS Loopback Transfer PASS: $recvHash"
          } finally {
            if ($rxProc -and -not $rxProc.HasExited) {
              Stop-Process -Id $rxProc.Id -Force
            }
          }

      - name: Package Windows artifact
        shell: powershell
        run: |
          $buildDir = "apps\libreshare_app\build\windows\x64\runner\Release"
          $distDir = "dist"
          New-Item -ItemType Directory -Path $distDir -Force
          $zipPath = "$distDir\libreshare-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash
          "$hash  libreshare-windows-x64.zip" | Out-File -FilePath "$distDir\libreshare-windows-x64.zip.sha256" -Encoding ascii
          Write-Host "Artifact packaged: $zipPath (SHA256: $hash)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreshare-windows-x64
          path: dist/
          retention-days: 14
